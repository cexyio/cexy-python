    server.error:
      name: error
      title: '`error`'
      summary: A request failed, or the connection is about to close.
      description: 'A request failed, or the connection is about to close. `code` is from the same vocabulary
        as the REST API.


        | Code | When |

        |---|---|

        | `MALFORMED_REQUEST` | A frame that is not a valid client operation. The connection stays open.
        |

        | `MALFORMED_REQUEST` | A binary frame: the protocol is JSON text only. |

        | `RATE_LIMITED` | More than 240 client frames in a minute. The connection then closes. |

        | `VALIDATION_FAILED` | A channel name that does not parse; `id` is the request''s. |

        | `UNAUTHENTICATED` | A private channel before signing in. |

        | `RATE_LIMITED` | More than 100 channels on one connection. The rest of that request is not processed.
        |

        | `NOT_FOUND` | A market channel naming a market that is not listed. |

        | `CONCURRENT_MODIFICATION` | The connection fell behind and frames were dropped; the message
        says how many. Fetch fresh snapshots over REST. |

        | `RATE_LIMITED` | Too many `auth_key` attempts from the client''s address. Carries the next challenge.
        |

        | `RATE_LIMITED` | The fifth failed `auth_key` on one connection. The connection then closes.
        |

        | (as given) | `auth` or `auth_key` refused: the code is sign-in''s own, as REST would answer
        (for example `UNAUTHENTICATED` or `SESSION_REVOKED`), or `FORBIDDEN` for an API key without the
        `read` scope. A refused `auth_key` carries the next challenge, and counts towards closing the
        connection. A refused sign-in ends any previous one on the connection. |

        | (as given) | A futures channel whose data cannot be served: `NOT_FOUND` when futures data or
        the caller''s futures account is not available, `RATE_LIMITED` when new upstream feeds or account
        updates are paused for a while. |'
      payload:
        type: object
        description: 'A request failed, or the connection is about to close. `code` is from the same vocabulary
          as the REST API.


          | Code | When |

          |---|---|

          | `MALFORMED_REQUEST` | A frame that is not a valid client operation. The connection stays open.
          |

          | `MALFORMED_REQUEST` | A binary frame: the protocol is JSON text only. |

          | `RATE_LIMITED` | More than 240 client frames in a minute. The connection then closes. |

          | `VALIDATION_FAILED` | A channel name that does not parse; `id` is the request''s. |

          | `UNAUTHENTICATED` | A private channel before signing in. |

          | `RATE_LIMITED` | More than 100 channels on one connection. The rest of that request is not
          processed. |

          | `NOT_FOUND` | A market channel naming a market that is not listed. |

          | `CONCURRENT_MODIFICATION` | The connection fell behind and frames were dropped; the message
          says how many. Fetch fresh snapshots over REST. |

          | `RATE_LIMITED` | Too many `auth_key` attempts from the client''s address. Carries the next
          challenge. |

          | `RATE_LIMITED` | The fifth failed `auth_key` on one connection. The connection then closes.
          |

          | (as given) | `auth` or `auth_key` refused: the code is sign-in''s own, as REST would answer
          (for example `UNAUTHENTICATED` or `SESSION_REVOKED`), or `FORBIDDEN` for an API key without
          the `read` scope. A refused `auth_key` carries the next challenge, and counts towards closing
          the connection. A refused sign-in ends any previous one on the connection. |

          | (as given) | A futures channel whose data cannot be served: `NOT_FOUND` when futures data
          or the caller''s futures account is not available, `RATE_LIMITED` when new upstream feeds or
          account updates are paused for a while. |'
        required:
        - code
        - message
        - type
        properties:
          challenge:
            type: string
            description: 'After a failed `auth_key`: the challenge for the next attempt.'
          code:
            $ref: '#/components/schemas/ErrorCode'
          id:
            type: string
            description: Echo of the request id.
          message:
            type: string
            description: Human-readable message.
          type:
            const: error
