components:
  messages:
    client.auth:
      name: auth
      title: '`auth`'
      summary: Signs the connection in with an access token, the same short-lived token REST uses, sent
        in the frame rather than the URL.
      payload:
        type: object
        description: Signs the connection in with an access token, the same short-lived token REST uses,
          sent in the frame rather than the URL. Signing in again with a fresh token before the old one
          expires keeps the connection signed in; signing in as another account ends the previous account's
          private subscriptions.
        required:
        - token
        - op
        properties:
          id:
            type:
            - string
            - 'null'
            description: Echoed in the reply.
          op:
            const: auth
          token:
            type: string
            description: A current access token.
    client.auth_key:
      name: auth_key
      title: '`auth_key`'
      summary: Signs the connection in with an API key that has the `read` scope.
      payload:
        type: object
        description: 'Signs the connection in with an API key that has the `read` scope. `signature` is
          lowercase hex HMAC-SHA256, keyed with the key''s secret (its UTF-8 bytes), of `CEXY-WS-AUTH-v1\n<connection_id>\n<challenge>`,
          where `challenge` is the current one: from `welcome` first, then from each reply to `auth_key`.
          Each challenge is good for one attempt. Five failures close the connection.'
        required:
        - key_id
        - signature
        - op
        properties:
          id:
            type:
            - string
            - 'null'
            description: Echoed in the reply.
          key_id:
            type: string
            description: The key's public id.
          op:
            const: auth_key
          signature:
            type: string
            description: The signature of the current challenge.
    client.subscribe:
      name: subscribe
      title: '`subscribe`'
      summary: Subscribes to channels.
      payload:
        type: object
        description: Subscribes to channels. Each refused channel gets its own `error` (with this request's
          `id`); the rest are subscribed, and listed in one `subscribed`.
        required:
        - channels
        - op
        properties:
          channels:
            type: array
            items:
              type: string
            description: Channel names, e.g. `ticker:BTC/USDT`, `orders`.
          id:
            type:
            - string
            - 'null'
            description: Echoed in the reply.
          op:
            const: subscribe
    client.unsubscribe:
      name: unsubscribe
      title: '`unsubscribe`'
      summary: Unsubscribes from channels.
      payload:
        type: object
        description: Unsubscribes from channels.
        required:
        - channels
        - op
        properties:
          channels:
            type: array
            items:
              type: string
            description: Channel names.
          id:
            type:
            - string
            - 'null'
            description: Echoed in the reply.
          op:
            const: unsubscribe
    client.ping:
      name: ping
      title: '`ping`'
      summary: Proves the connection is alive.
      payload:
        type: object
        description: 'Proves the connection is alive. The server closes a connection it has heard nothing
          from for more than 90 seconds (checked every 30): send `ping` at least every 30 seconds. The
          server''s own unprompted `pong` frames do not count.'
        required:
        - op
        properties:
          id:
            type:
            - string
            - 'null'
            description: Echoed in the reply.
          op:
            const: ping
    server.welcome:
      name: welcome
      title: '`welcome`'
      summary: The first frame on every connection.
      description: The first frame on every connection.
      payload:
        type: object
        description: The first frame on every connection.
        required:
        - protocol_version
        - heartbeat_interval_seconds
        - max_subscriptions
        - connection_id
        - challenge
        - type
        properties:
          challenge:
            type: string
            description: This connection's first API-key sign-in challenge; see `auth_key`.
          connection_id:
            type: string
            description: Correlates this connection with server logs, and is part of what an API-key sign-in
              signs.
          heartbeat_interval_seconds:
            type: integer
            format: int64
            description: Seconds of silence after which the server closes the connection.
            minimum: 0
          max_subscriptions:
            type: integer
            description: Maximum channels one connection may hold.
            minimum: 0
          protocol_version:
            type: integer
            format: int32
            description: Protocol version. Increments only on a breaking change.
            minimum: 0
          type:
            const: welcome
    server.authenticated:
      name: authenticated
      title: '`authenticated`'
      summary: The reply to a successful `auth` or `auth_key`.
      description: The reply to a successful `auth` or `auth_key`. After `auth_key` it carries the next
        challenge.
      payload:
        type: object
        description: The reply to a successful `auth` or `auth_key`. After `auth_key` it carries the next
          challenge.
        required:
        - user_id
        - auth
        - type
        properties:
          auth:
            type: string
            description: 'How it signed in: `session` or `api_key`.'
          challenge:
            type: string
            description: 'After an `auth_key`: the challenge for the next one.'
          id:
            type: string
            description: Echo of the request id.
          type:
