asyncapi: 3.0.0
id: urn:cexy:api:websocket
info:
  title: CEXY WebSocket API
  version: '1'
  description: 'The realtime API: market data, and the caller''s own orders, balances, deposits, withdrawals
    and futures data, over one WebSocket.


    ## Connecting


    Connect to `wss://api.cexy.io/api/v1/ws`. The first frame is `welcome`. Every frame is a JSON text
    frame, in both directions; a binary frame is answered with an `error`. A frame the client sends that
    is larger than 64 KiB ends the connection: the server drops it without a close code. The limit is
    on what the client sends only: the server''s own frames are not held to it, so a client must accept
    larger ones.


    ## Signing in


    Never in the URL. Send `auth` with an access token, or `auth_key` with an API key''s signature of
    this connection''s challenge. Public channels need no sign-in; private ones are refused until it succeeds.
    When a sign-in ends (its token expired without a fresh `auth`, its session or key was revoked, the
    key expired), the server sends `signed_out`: private subscriptions have ended, public ones and the
    socket continue.


    ## Subscribing


    `subscribe` with channel names. Spot market names are normalised (`btc_usdt` becomes `BTC/USDT`);
    futures coins are case-sensitive. A connection may hold 100 channels.


    ## Frames and sequences


    An event frame carries `type` (the event), `channel`, usually `sequence`, `timestamp` and `data`.
    Event frames currently begin with a first `"type": "event"` key, repeated by the event''s own `type`.
    The second `type`, the event''s name, is authoritative: JSON parsers keep the last value of a repeated
    key, so they read the event''s name. Do not rely on the first; dropping it is planned for version
    2, and version 1 keeps it. On a sequenced channel, `sequence` rises by one per frame; a gap means
    frames were missed. Amounts are decimal strings, never JSON numbers.


    ## Keeping up


    Send `ping` at least every 30 seconds: a connection the server has heard nothing from for 90 seconds
    (checked every 30) is closed. The server sends `pong` unprompted every 30 seconds; those do not count
    as hearing from the client. A client may send 240 frames a minute; the next closes the connection.
    A connection whose outgoing queue (256 frames) stays full is closed; one whose subscription falls
    behind gets an `error` `CONCURRENT_MODIFICATION` saying how many frames it missed, and should refetch
    over REST.


    ## After a reconnect, or any `*.resync`


    Refetch over REST, then resubscribe. Futures market channels send no snapshot on subscribe, and `futures.resync`
    may arrive at any time.'
