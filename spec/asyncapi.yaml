      required:
      - coin
      - trades
      properties:
        coin:
          type: string
          description: The coin.
        trades:
          type: array
          items:
            $ref: '#/components/schemas/PublicTrade'
          description: The trades, oldest first.
    Level:
      type: object
      description: One price level.
      required:
      - price
      - size
      properties:
        price:
          $ref: '#/components/schemas/Amount'
        size:
          $ref: '#/components/schemas/Amount'
    LiquidityRole:
      type: string
      description: Whether a fill added liquidity (maker) or removed it (taker).
      enum:
      - maker
      - taker
    MarketResponse:
      type: object
      description: A tradable market and its current ticker.
      required:
      - base_asset
      - best_ask
      - best_bid
      - change_24h_percent
      - high_24h
      - last_price
      - last_trade_at
      - lot_size
      - low_24h
      - max_quantity
      - min_notional
      - min_quantity
      - price_decimals
      - quantity_decimals
      - quote_asset
      - quote_volume_24h
      - status
      - supported_order_types
      - supported_time_in_force
      - symbol
      - tick_size
      - trading_starts_at
      - volume_24h
      properties:
        base_asset:
          type: string
          description: Base asset symbol.
        best_ask:
          $ref: '#/components/schemas/Amount'
        best_bid:
          $ref: '#/components/schemas/Amount'
        change_24h_percent:
          $ref: '#/components/schemas/Amount'
        high_24h:
          $ref: '#/components/schemas/Amount'
        last_price:
          $ref: '#/components/schemas/Amount'
        last_trade_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Time of the most recent trade.
        lot_size:
          $ref: '#/components/schemas/Amount'
        low_24h:
          $ref: '#/components/schemas/Amount'
        max_quantity:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/Amount'
          - type: 'null'
        min_notional:
          $ref: '#/components/schemas/Amount'
        min_quantity:
          $ref: '#/components/schemas/Amount'
        price_decimals:
          type: integer
          format: int32
          description: Decimal places a price may carry.
          minimum: 0
        quantity_decimals:
          type: integer
          format: int32
          description: Decimal places a quantity may carry.
          minimum: 0
        quote_asset:
          type: string
          description: Quote asset symbol.
        quote_volume_24h:
          $ref: '#/components/schemas/Amount'
        status:
          $ref: '#/components/schemas/MarketStatus'
        supported_order_types:
          type: array
          items:
            $ref: '#/components/schemas/OrderType'
          description: Order types this market accepts.
        supported_time_in_force:
          type: array
          items:
            $ref: '#/components/schemas/TimeInForce'
          description: Time-in-force options this market accepts.
        symbol:
          type: string
          description: '`BASE/QUOTE`.'
          examples:
          - BTC/USDT
        tick_size:
          $ref: '#/components/schemas/Amount'
        trading_starts_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When trading opens, for a market not yet live.
        volume_24h:
          $ref: '#/components/schemas/Amount'
    MarketStatus:
      type: string
      description: Trading availability of a market.
      enum:
      - active
      - paused
      - sell_only
      - pre_trading
      - delisted
    OpenOrder:
      type: object
      description: One open order.
      required:
      - coin
      - id
      - order_type
      - original_size
      - placed_at
      - price
      - reduce_only
      - side
      - size
      - trigger_price
      properties:
        coin:
          type: string
          description: Coin.
        id:
          type: string
          description: Our id for it, stable across reads.
        order_type:
          type: string
          description: The order type as the provider names it (`Limit`, `Stop Market`, ...).
        original_size:
          $ref: '#/components/schemas/Amount'
        placed_at:
          type: integer
          format: int64
          description: When placed, unix milliseconds.
        price:
          $ref: '#/components/schemas/Amount'
        reduce_only:
          type: boolean
          description: Whether it may only reduce a position.
        side:
          type: string
          description: '`buy` or `sell`.'
        size:
          $ref: '#/components/schemas/Amount'
        trigger_price:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/Amount'
          - type: 'null'
    OrderBookUpdateData:
      type: object
      description: 'The `orderbook.update` payload: the top of one market''s book.


        Every update replaces the previous one; it is not a delta. A client that misses one is correct
        again as soon as the next arrives.'
      required:
      - asks
      - bids
      - full
      - symbol
      properties:
        asks:
          type: array
          items:
            $ref: '#/components/schemas/BookLevel'
          description: Asks, best first, up to 50 levels.
        bids:
          type: array
          items:
            $ref: '#/components/schemas/BookLevel'
          description: Bids, best first, up to 50 levels.
        full:
          type: boolean
          description: 'Always `true`: both sides are complete to the depth sent and replace local state.
            Explicit so a client never has to infer replace-versus-merge from the event name.'
        symbol:
          type: string
          description: Market symbol.
    OrderFillData:
      type: object
      description: 'One of the caller''s fills (the second shape of `order.filled`): told once per side
        the caller took in a trade, so a self-trade sends two.'
      required:
      - fee
      - fee_asset
      - order_id
      - price
      - quantity
      - quote_quantity
      - role
      - side
      - symbol
      - timestamp
      - trade_id
      properties:
        fee:
          $ref: '#/components/schemas/Amount'
        fee_asset:
          type: string
          description: 'The asset `fee` is in: always the market''s quote asset, for maker and taker,
            buyer and seller alike.'
        order_id:
          type: string
          description: The caller's order that filled.
        price:
          $ref: '#/components/schemas/Amount'
        quantity:
          $ref: '#/components/schemas/Amount'
        quote_quantity:
          $ref: '#/components/schemas/Amount'
        role:
          $ref: '#/components/schemas/LiquidityRole'
        side:
          $ref: '#/components/schemas/OrderSide'
        symbol:
          type: string
          description: Market symbol.
        timestamp:
          type: string
          format: date-time
          description: When it executed.
        trade_id:
          type: string
          description: The trade.
    OrderResponse:
      type: object
      description: An order.
      required:
      - average_price
      - client_order_id
      - closed_at
      - created_at
      - fee_asset
      - fee_paid
      - filled_quantity
      - filled_quote_quantity
      - id
      - price
      - quantity
      - quote_quantity
      - remaining_quantity
      - reserved_remaining
      - side
      - status
      - status_reason
      - stop_price
      - symbol
      - time_in_force
      - trigger_direction
      - triggered_at
      - type
      - updated_at
      properties:
        average_price:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/Amount'
          - type: 'null'
        client_order_id:
          type:
          - string
          - 'null'
          description: Your identifier, if you supplied one.
        closed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When it reached a terminal state.
        created_at:
          type: string
          format: date-time
          description: When it was placed.
        fee_asset:
          type:
          - string
          - 'null'
          description: Asset the fees were charged in.
        fee_paid:
          $ref: '#/components/schemas/Amount'
        filled_quantity:
          $ref: '#/components/schemas/Amount'
        filled_quote_quantity:
          $ref: '#/components/schemas/Amount'
        id:
          type: string
          description: Order id.
        price:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/Amount'
          - type: 'null'
        quantity:
          $ref: '#/components/schemas/Amount'
        quote_quantity:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/Amount'
          - type: 'null'
        remaining_quantity:
          $ref: '#/components/schemas/Amount'
        reserved_remaining:
          $ref: '#/components/schemas/Amount'
        side:
          $ref: '#/components/schemas/OrderSide'
        status:
          $ref: '#/components/schemas/OrderStatus'
        status_reason:
          type:
          - string
          - 'null'
          description: Why the order was rejected or cancelled.
        stop_price:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/Amount'
          - type: 'null'
        symbol:
          type: string
          description: Market symbol.
        time_in_force:
          $ref: '#/components/schemas/TimeInForce'
        trigger_direction:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/TriggerDirection'
          - type: 'null'
        triggered_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the trigger fired, if it has.
        type:
          $ref: '#/components/schemas/OrderType'
        updated_at:
          type: string
          format: date-time
          description: When it last changed.
    OrderSide:
      type: string
      description: Which side of a market an order takes.
      enum:
      - buy
      - sell
    OrderStatus:
      type: string
      description: Lifecycle of an order.
      enum:
      - pending
      - open
      - partially_filled
      - filled
      - cancelled
      - rejected
      - pending_trigger
      - expired
    OrderType:
      type: string
      description: Order types the matching engine accepts.
      enum:
      - limit
      - market
      - stop_limit
      - stop_market
    Position:
      type: object
      description: One open position.
      required:
      - coin
      - entry_price
      - funding_since_open
      - leverage
      - leverage_type
      - liquidation_price
      - margin_used
      - position_value
      - return_on_equity
      - size
      - unrealized_pnl
      properties:
        coin:
          type: string
          description: Coin.
        entry_price:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/Amount'
          - type: 'null'
        funding_since_open:
          $ref: '#/components/schemas/Amount'
        leverage:
          type: integer
          format: int32
          description: Leverage.
          minimum: 0
        leverage_type:
          type: string
          description: '`cross` or `isolated`.'
        liquidation_price:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/Amount'
          - type: 'null'
        margin_used:
          $ref: '#/components/schemas/Amount'
        position_value:
          $ref: '#/components/schemas/Amount'
        return_on_equity:
          $ref: '#/components/schemas/Amount'
        size:
          $ref: '#/components/schemas/Amount'
        unrealized_pnl:
          $ref: '#/components/schemas/Amount'
    Positions:
      type: object
      description: A margin summary and the open positions.
      required:
      - account_value
      - maintenance_margin
      - margin_used
      - positions
      - total_notional
      properties:
        account_value:
          $ref: '#/components/schemas/Amount'
        maintenance_margin:
          $ref: '#/components/schemas/Amount'
        margin_used:
          $ref: '#/components/schemas/Amount'
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'
          description: The open positions.
        total_notional:
          $ref: '#/components/schemas/Amount'
    PublicTrade:
      type: object
      description: A public trade, with nothing that identifies the parties.
      required:
      - price
      - side
      - size
      - time
      properties:
        price:
          $ref: '#/components/schemas/Amount'
        side:
          type: string
          description: '`buy` or `sell`: the taker''s side.'
        size:
          $ref: '#/components/schemas/Amount'
        time:
          type: integer
          format: int64
          description: When, unix milliseconds.
    SessionRevocation:
      type: string
      description: Why a session ended.
      enum:
      - logout
      - logout_all
      - password_changed
      - two_factor_changed
      - email_changed
      - admin_action
      - refresh_replay_detected
    SessionRevokedData:
      type: object
      description: A session on the account was revoked (`session.revoked`).
      required:
      - current
      - reason
      - session_id
      properties:
        current:
          type: boolean
          description: Whether it is the session this connection signed in with (always, when every session
            was). When `true` the connection is signed out next. Added by each connection on its way out,
            so it is never `null` on the wire.
        reason:
          $ref: '#/components/schemas/SessionRevocation'
        session_id:
          type:
          - string
          - 'null'
          description: The session revoked; `null` when every session of the account was.
    SignOutReason:
      type: string
      description: Why a connection was signed out.
      enum:
      - expired
      - revoked
      - key_revoked
      - key_expired
    StreamState:
      type: string
      description: Whether the upstream stream is working.
      enum:
      - live
      - degraded
    TimeInForce:
      type: string
      description: How long an order remains eligible to match.
      enum:
      - gtc
      - ioc
      - fok
      - post_only
    TradeNewData:
      type: object
      description: 'A public trade on a spot market (`trade.new`). Anonymous: no account or order ids.'
      required:
      - id
      - price
      - quantity
      - sequence
      - side
      - timestamp
      properties:
        id:
          type: string
          description: The trade's id.
        price:
          $ref: '#/components/schemas/Amount'
        quantity:
          $ref: '#/components/schemas/Amount'
        sequence:
          type: integer
          format: int64
          description: The market's trade sequence, as on the REST trade list.
        side:
          $ref: '#/components/schemas/OrderSide'
        timestamp:
          type: string
          format: date-time
          description: When it executed.
    TriggerDirection:
      type: string
      description: 'Which way the price must move for a stop to fire.


        Explicit rather than inferred from the side, because the inference is ambiguous: a sell stop below
        the market is a stop-loss, and a sell stop above it is a take-profit. Both are legitimate, and
        guessing wrong means an order that fires at exactly the wrong moment — which is the one thing
        a protective order must never do.'
      enum:
      - above
      - below
    WithdrawalEventData:
      type: object
      description: A withdrawal (`withdrawal.updated`).
      required:
      - amount
      - asset
      - confirmations
      - fee
      - id
      - network
      - status
      - txid
      - updated_at
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        asset:
          type: string
          description: Asset symbol.
        confirmations:
          type: integer
          format: int32
          description: Confirmations seen.
          minimum: 0
        fee:
          $ref: '#/components/schemas/Amount'
        id:
          type: string
          description: The withdrawal.
        network:
          type: string
          description: Network code.
        status:
          $ref: '#/components/schemas/WithdrawalStatus'
        txid:
          type:
          - string
          - 'null'
          description: The transaction, once broadcast; `null` before.
        updated_at:
          type: string
          format: date-time
          description: When it last changed.
    WithdrawalStatus:
      type: string
      description: 'Lifecycle of an outgoing withdrawal.




        `pending_approval` waits for an operator to approve the withdrawal. `broadcast_unknown`

        means the transaction may have been sent: the funds stay debited until it is resolved

        against the chain.'
      enum:
      - requested
      - pending_approval
      - approved
      - processing
      - broadcast
      - completed
      - rejected
      - cancelled
      - failed
      - broadcast_unknown
      - reverted
