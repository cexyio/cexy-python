  schemas:
    Amount:
      type: string
      description: 'Exact decimal amount, serialized as a string to avoid floating-point precision loss.
        Example: "1.50000000".'
      examples:
      - '1.50000000'
      pattern: ^-?\d+(\.\d+)?$
    BalanceUpdatedData:
      type: object
      description: An account's balance in one asset (`balance.updated`), as committed.
      required:
      - asset
      - available
      - locked
      - pending
      - sequence
      - total
      properties:
        asset:
          type: string
          description: Asset symbol.
        available:
          $ref: '#/components/schemas/Amount'
        locked:
          $ref: '#/components/schemas/Amount'
        pending:
          $ref: '#/components/schemas/Amount'
        sequence:
          type: integer
          format: int64
          description: 'The balance''s own counter, rising with every change to it. Events can arrive
            out of order: one at or below the sequence a client already holds is ignored.'
        total:
          $ref: '#/components/schemas/Amount'
    BookLevel:
      type: array
      items:
        $ref: '#/components/schemas/Amount'
      description: 'A single order-book level.


        `[price, quantity]`, both decimal strings.'
      maxItems: 2
      minItems: 2
    Candle:
      type: object
      description: One candle.
      required:
      - close
      - close_time
      - high
      - low
      - open
      - open_time
      - trades
      - volume
      properties:
        close:
          $ref: '#/components/schemas/Amount'
        close_time:
          type: integer
          format: int64
          description: Close time, unix milliseconds.
        high:
          $ref: '#/components/schemas/Amount'
        low:
          $ref: '#/components/schemas/Amount'
        open:
          $ref: '#/components/schemas/Amount'
        open_time:
          type: integer
          format: int64
          description: Open time, unix milliseconds.
        trades:
          type: integer
          format: int64
          description: Number of trades.
          minimum: 0
        volume:
          $ref: '#/components/schemas/Amount'
    DepositEventData:
      type: object
      description: A deposit (`deposit.detected`, `deposit.updated`, `deposit.completed`).
      required:
      - amount
      - asset
      - confirmations
      - id
      - network
      - required_confirmations
      - status
      - txid
      - updated_at
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        asset:
          type: string
          description: Asset symbol.
        confirmations:
          type: integer
          format: int32
          description: Confirmations seen.
          minimum: 0
        id:
          type: string
          description: The deposit.
        network:
          type: string
          description: Network code.
        required_confirmations:
          type: integer
          format: int32
          description: Confirmations needed before it is credited.
          minimum: 0
        status:
          $ref: '#/components/schemas/DepositStatus'
        txid:
          type: string
          description: The transaction that carried it.
        updated_at:
          type: string
          format: date-time
          description: When it last changed.
    DepositStatus:
      type: string
      description: Lifecycle of an incoming blockchain deposit.
      enum:
      - detected
      - credited
      - reversed
      - orphaned
      - below_minimum
      - under_review
      - internal
    EmptyData:
      type: object
      description: 'Nothing: the `*.resync` notices carry no data. Refetch over REST and continue.'
      properties: {}
    ErrorCode:
      type: string
      description: 'Stable, machine-readable error identifiers.


        Serialized as `SCREAMING_SNAKE_CASE`. Adding a variant is backwards-compatible; renaming or removing
        one is a breaking API change.'
      enum:
      - VALIDATION_FAILED
      - MALFORMED_REQUEST
      - INVALID_CURSOR
      - PRECISION_EXCEEDED
      - BELOW_MINIMUM
      - ABOVE_MAXIMUM
      - INVALID_ADDRESS
      - MEMO_REQUIRED
      - UNAUTHENTICATED
      - INVALID_CREDENTIALS
      - TOKEN_EXPIRED
      - SESSION_REVOKED
      - TWO_FACTOR_REQUIRED
      - TWO_FACTOR_INVALID
      - FRESH_TWO_FACTOR_REQUIRED
      - FORBIDDEN
      - API_KEY_NOT_ALLOWED
      - KEY_NOT_SIGNABLE
      - SIGNATURE_EXPIRED
      - NONCE_REUSED
      - SIGNATURE_REQUIRED
      - FUTURES_RESTRICTED
      - ACCOUNT_FROZEN
      - ACCOUNT_ON_HOLD
      - EMAIL_NOT_VERIFIED
      - REGION_BLOCKED
      - JURISDICTION_BLOCKED
      - NOT_FOUND
      - METHOD_NOT_ALLOWED
      - ALREADY_EXISTS
      - INVALID_STATE
      - IDEMPOTENCY_KEY_CONFLICT
      - WINDOW_OPEN
      - EVIDENCE_CONTRADICTS
      - AMOUNT_MISMATCH
      - CONCURRENT_MODIFICATION
      - DEAD_MAN_NOT_ARMED
      - INSUFFICIENT_FUNDS
      - INSUFFICIENT_FEE_FUNDS
      - MARKET_UNAVAILABLE
      - DEPOSIT_DISABLED
      - WITHDRAWAL_DISABLED
      - SELF_TRADE_BLOCKED
      - LIMIT_EXCEEDED
      - PRICE_UNAVAILABLE
      - RATE_LIMITED
      - INTERNAL
      - SERVICE_UNAVAILABLE
      - UNDER_MAINTENANCE
      - ENGINE_OVERLOADED
    FuturesBookData:
      type: object
      description: A futures market's book, in full (`futures.orderbook.update`).
      required:
      - as_of
      - asks
      - bids
      - coin
      - full
      properties:
        as_of:
          type: string
          format: date-time
          description: When the server sent it.
        asks:
          type: array
          items:
            $ref: '#/components/schemas/Level'
          description: Asks, best first.
        bids:
          type: array
          items:
            $ref: '#/components/schemas/Level'
          description: Bids, best first.
        coin:
          type: string
          description: The coin.
        full:
          type: boolean
          description: 'Always `true`: both sides replace what the client held.'
    FuturesCandleData:
      type: object
      description: A futures market's current candle (`futures.candle.update`).
      required:
      - candle
      - coin
      - interval
      properties:
        candle:
          $ref: '#/components/schemas/Candle'
        coin:
          type: string
          description: The coin.
        interval:
          type: string
          description: 'The interval: `1m`, `5m`, `15m`, `1h`, `4h` or `1d`.'
    FuturesMidsData:
      type: object
      description: Every futures market's mid price (`futures.mids`).
      required:
