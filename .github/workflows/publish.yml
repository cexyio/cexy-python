name: publish
# Tag-triggered release to PyPI with trusted publishing (OIDC). No API tokens are stored.
# The build job has no id-token permission; the publish job has id-token: write and only
# downloads the built artifact and uploads it (no installs, scripts or tests).
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Refuse a tag whose commit is not on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main"; exit 1; }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - name: Tag matches package version
        run: |
          version=$(python -c "import re;print(re.search(r'^version = \"(.+)\"', open('pyproject.toml').read(), re.M).group(1))")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: pip install -e ".[dev]" build==1.2.2
      - run: pytest -q
      - name: Build
        run: python -m build
      - name: Check the distributions (same twine as the publish action)
        run: |
          pip install twine==7.0.0 packaging==26.2
          twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: dist, path: dist/, if-no-files-found: error}

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC token for PyPI trusted publishing; nothing else runs here
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
