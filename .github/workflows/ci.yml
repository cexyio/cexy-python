name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "${{ matrix.python-version }}"}
      - run: pip install -e ".[dev]"
      # Offline suite: mocked HTTP, a local fake WebSocket server, conformance fixtures.
      # Live tests are skipped (CEXY_LIVE_TESTS is not set).
      - run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  generated:
    # Generated code must match the spec and the generator pins exactly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev,codegen]"
      - run: scripts/generate.sh
      - name: No drift in cexy/_generated or cexy/_sync
        run: git diff --exit-code -- cexy/
      - name: Check out cexy-api-spec
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {repository: cexyio/cexy-api-spec, path: .cexy-api-spec}
      - name: Vendored spec, conformance fixtures and scanner match cexy-api-spec
        run: |
          scripts/sync_spec.sh .cexy-api-spec --check
          cmp tools/scan_internal.py .cexy-api-spec/tools/scan_internal.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - name: No internal references
        env:
          SCAN_PATTERNS: ${{ secrets.SCAN_PATTERNS }}
        run: |
          printf '%s\n' "$SCAN_PATTERNS" > "$RUNNER_TEMP/scan-patterns.txt"
          CEXY_SCAN_PATTERNS_FILE="$RUNNER_TEMP/scan-patterns.txt" python tools/scan_internal.py .
      - name: Secret scan (gitleaks 8.21.2, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --no-banner --redact
      - name: Dependency audit
        run: pip install pip-audit==2.7.3 && pip-audit .
